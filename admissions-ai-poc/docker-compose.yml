# POC-level docker-compose: single backend service on SQLite.
# For a more production-like setup, add a postgres service and point
# DATABASE_URL at it (see backend/app/config/settings.py).

services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./admissions_poc.db
      # --- Email: pick ONE of these two options ---
      # Option A: Gmail/SMTP (no third-party signup, uses an App Password)
      # - SMTP_USERNAME=youraccount@gmail.com
      # - SMTP_PASSWORD=your16charapppassword
      # - NOTIFICATION_FROM_EMAIL=youraccount@gmail.com
      # Option B: SendGrid
      # - SENDGRID_API_KEY=
      # - NOTIFICATION_FROM_EMAIL=admissions@example.com
      # Leave all of the above unset to use console-logged email fallback
      # - ANTHROPIC_API_KEY=       # leave unset to use template-based explanations instead of LLM
      # - ANTHROPIC_MODEL=claude-haiku-4-5-20251001
    volumes:
      - ./backend:/app
      - ./data:/data
