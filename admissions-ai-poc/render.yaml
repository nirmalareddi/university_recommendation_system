# Render Blueprint — deploys the backend API, the static frontend,
# and a PostgreSQL database.

databases:
  - name: admissions-db
    plan: free
    databaseName: admissions_poc
    user: admissions_poc

services:
  - type: web
    name: admissions-api
    runtime: python
    plan: free
    rootDir: admissions-ai-poc/backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"

    envVars:
      - key: PYTHON_VERSION
        value: "3.13.5"

      - key: DATABASE_URL
        fromDatabase:
          name: admissions-db
          property: connectionString

      - key: ALLOWED_ORIGINS
        value: "*"

      - key: ANTHROPIC_API_KEY
        sync: false

      - key: SMTP_USERNAME
        sync: false

      - key: SMTP_PASSWORD
        sync: false

      - key: NOTIFICATION_FROM_EMAIL
        sync: false

  - type: web
    name: admissions-frontend
    runtime: static
    rootDir: admissions-ai-poc/frontend/student-form
    buildCommand: ""
    staticPublishPath: .